name: Ayllu
options:
  bundleIdPrefix: com.ayllu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  UTMConversion:
    url: https://github.com/wtw-software/UTMConversion.git
    from: "1.4.0"
  CoreGPX:
    url: https://github.com/vincentneo/CoreGPX.git
    from: "0.9.0"
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: "6.0.0"

targets:
  Ayllu:
    type: application
    platform: iOS
    sources:
      - path: Ayllu
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Ayllu/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ayllu.fieldresearch
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - package: GRDB
      - package: UTMConversion
      - package: CoreGPX
      - package: MapLibre
    entitlements:
      path: Ayllu/App/Ayllu.entitlements
      properties:
        com.apple.security.app-sandbox: true

  AylluTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AylluTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ayllu.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ayllu"
        PRODUCT_BUNDLE_IDENTIFIER: com.ayllu.fieldresearch.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Ayllu
      - package: GRDB

  AylluUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AylluUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayllu.fieldresearch.uitests
        TEST_TARGET_NAME: Ayllu
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Ayllu

schemes:
  Ayllu:
    build:
      targets:
        Ayllu: all
        AylluTests: [test]
        AylluUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AylluTests
        - AylluUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
